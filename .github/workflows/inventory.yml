name: Update Inventory

on:
  workflow_dispatch:
  schedule:
    - cron: '14,29,44,59 * * * *' # Every 15 minutes, off the hour

# Disable all GITHUB_TOKEN permissions, since the GitHub App token is used instead.
permissions: { }

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-nodejs-inventory:
    name: Update Node.js Inventory
    runs-on: pub-hk-ubuntu-24.04-ip
    timeout-minutes: 10

    steps:
      - uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          app-id: ${{ vars.LINGUIST_GH_APP_ID }}
          private-key: ${{ secrets.LINGUIST_GH_PRIVATE_KEY }}

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update Rust toolchain
        run: rustup update

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Rebuild Inventory
        id: rebuild-inventory
        run: |
          delimiter="$(openssl rand -hex 8)"
          {
            echo "msg<<${delimiter}"
            cargo update-nodejs-inventory
            echo "${delimiter}"
          } >> $GITHUB_OUTPUT

      - name: Check for inventory changes
        id: check-inventory
        run: |
          if git diff --quiet inventory/nodejs.toml; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No inventory changes detected, skipping PR creation."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Inventory changes detected."
          fi

      # Skip updating an open inventory PR that already contains these inventory changes, so
      # manual changes pushed to the PR branch aren't overwritten by a run that would push the
      # same inventory again.
      - name: Check for an up-to-date inventory PR
        if: steps.check-inventory.outputs.changed == 'true'
        id: existing-pr
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          pr_number=$(gh pr list --head update-nodejs-inventory --state open --json number --jq '.[0].number')
          if [[ -n "${pr_number}" ]] \
            && git fetch --quiet --depth 1 origin update-nodejs-inventory \
            && git diff --quiet FETCH_HEAD -- inventory/nodejs.toml; then
            echo "up-to-date=true" >> "$GITHUB_OUTPUT"
            echo "Inventory PR #${pr_number} already contains these inventory changes, skipping PR update."
          else
            echo "up-to-date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.check-inventory.outputs.changed == 'true' && steps.existing-pr.outputs.up-to-date != 'true'
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          title: "Update Node.js Inventory"
          commit-message: "Update Node.js inventory\n\n${{ steps.rebuild-inventory.outputs.msg }}"
          committer: ${{ vars.LINGUIST_GH_APP_USERNAME }} <${{ vars.LINGUIST_GH_APP_EMAIL }}>
          author: ${{ vars.LINGUIST_GH_APP_USERNAME }} <${{ vars.LINGUIST_GH_APP_EMAIL }}>
          branch: update-nodejs-inventory
          body: "Automated pull request to update the Node.js runtime inventory:\n\n${{ steps.rebuild-inventory.outputs.msg }}"

      - name: Configure PR
        if: steps.check-inventory.outputs.changed == 'true' && steps.pr.outputs.pull-request-operation == 'created'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: gh pr merge --squash --auto "${{ steps.pr.outputs.pull-request-number }}"

